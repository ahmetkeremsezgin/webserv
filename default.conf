server {
    host 127.0.0.1;
    listen 8080;
    server_name example.com;

    client_max_body_size 1048576;

    error_page 404 ./www/errors/404.html;
    error_page 500 ./www/errors/500.html;

    location / {
        root ./www/html;
        index index.html;
        allowed_methods GET POST;
        autoindex off;
    }

    location /upload {
        root ./www/uploads;
        allowed_methods POST DELETE;
        upload_enable on;
        upload_store ./www/uploads;
    }

    location /cgi-bin {
        root ./www/cgi;
        allowed_methods GET POST;
        cgi .php /usr/bin/php-cgi;
    }
    
    location /old {
        redirect 301 /new;
    }
    location /google {
        redirect 302 http://www.google.com;
    }
}

server {
    listen 9090;

    location / {
        allowed_methods GET POST;
        root ./www/site2;
        index index.html;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        root ./www/site2/cgi-bin;
        cgi .py /opt/pyenv/shims/python3;
    }

    location /messages.json {
        allowed_methods GET;
        root ./www/site2;
    }
}

